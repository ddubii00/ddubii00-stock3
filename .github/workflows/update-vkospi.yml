name: Update VKOSPI data

on:
  schedule:
    - cron: '40 7 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch current VKOSPI spot history
        run: node scripts/update-vkospi.js
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/vkospi.json; then
            echo "VKOSPI data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vkospi.json
          git commit -m "Update VKOSPI data"
          git push
